<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歌曲資料庫</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    margin: 0;
    padding: 48px 16px;
    min-height: 100vh;
  }
  .container {
    max-width: 768px;
    margin: 0 auto;
    background: #1e293b;
    border-radius: 16px;
    padding: 32px;
    border: 1px solid #334155;
    box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 8px;
    background: linear-gradient(to right, #ec4899, #8b5cf6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle {
    color: #94a3b8;
    text-align: center;
    margin-bottom: 24px;
  }
  a { color: #a78bfa; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
  button, .btn-label {
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-weight: 500;
    font-size: 14px;
    transition: all 0.2s;
  }
  .btn-primary { background: #7c3aed; color: white; }
  .btn-primary:hover { background: #6d28d9; }
  .btn-secondary { background: #475569; color: white; }
  .btn-secondary:hover { background: #334155; }
  .btn-danger { background: #dc2626; color: white; }
  .btn-danger:hover { background: #b91c1c; }
  .btn-warning { background: #d97706; color: white; }
  .btn-warning:hover { background: #b45309; }
  form {
    background: #0f172a;
    padding: 24px;
    border-radius: 12px;
    border: 1px solid #334155;
    margin-bottom: 24px;
  }
  label { display: block; margin-top: 16px; font-weight: 600; color: #cbd5e1; }
  input, textarea {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    background: #1e293b;
    border: 1px solid #475569;
    border-radius: 8px;
    color: #e2e8f0;
    font-size: 14px;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: #8b5cf6;
    box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.3);
  }
  h2 { color: #e2e8f0; margin-top: 32px; }
  .song-item {
    background: #0f172a;
    padding: 20px;
    margin: 16px 0;
    border-radius: 12px;
    border: 1px solid #334155;
  }
  .song-item h3 { margin: 0 0 8px 0; color: #f1f5f9; }
  .song-item pre {
    white-space: pre-wrap;
    background: #1e293b;
    padding: 12px;
    border-radius: 8px;
    max-height: 200px;
    overflow-y: auto;
    color: #cbd5e1;
    font-size: 13px;
  }
  .song-item p { color: #94a3b8; margin: 8px 0; }
</style>
</head>
<body>
<div class="container">
  <h1>歌曲資料庫</h1>
  <p class="subtitle">新增歌曲資料（YouTube 連結、歌名、歌手、歌詞、描述、同義改寫）</p>
  <p style="text-align:center; margin-bottom:24px;"><a href="game.html">前往猜歌遊戲 →</a></p>

  <div class="btn-row">
    <button class="btn-primary" onclick="exportJSON()">匯出 songs.json</button>
    <label class="btn-label btn-secondary">
      匯入 JSON
      <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importJSON(this)">
    </label>
    <button class="btn-danger" onclick="clearAll()">清空所有歌曲</button>
  </div>

  <form id="songForm">
    <label for="youtube">YouTube 連結：</label>
    <input type="url" id="youtube" required placeholder="https://www.youtube.com/watch?v=xxxxxx">

    <label for="name">歌名：</label>
    <input type="text" id="name" required placeholder="例如：《更新我》 Renew Me">

    <label for="singer">歌手：</label>
    <input type="text" id="singer" required placeholder="例如：角聲使團 The Heralders">

    <label for="lyrics">歌詞：</label>
    <textarea id="lyrics" rows="8" required placeholder="請輸入完整歌詞，每句一行"></textarea>

    <label for="description">詳細解釋／演繹提示：</label>
    <textarea id="description" rows="3" placeholder="經過解釋或演繹的文字（不要直接貼歌詞）"></textarea>

    <label for="paraphrase">同義改寫歌詞：</label>
    <textarea id="paraphrase" rows="6" placeholder="用其他詞語重寫整首歌詞，意思相同但用字不同"></textarea>

    <button type="submit" class="btn-primary" style="margin-top:20px;">儲存歌曲</button>
  </form>

  <h2>已儲存歌曲</h2>
  <div id="songList"></div>
</div>

<script>
const STORAGE_KEY = 'songsData';

function loadSongs() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  } catch (e) {
    return [];
  }
}

function saveSongs(songs) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(songs));
  renderList();
}

function renderList() {
  const songs = loadSongs();
  const list = document.getElementById('songList');
  list.innerHTML = '';

  if (songs.length === 0) {
    list.innerHTML = '<p style="color:#94a3b8;">尚未儲存任何歌曲。請使用上方表單新增。</p>';
    return;
  }

  songs.forEach((song, index) => {
    const div = document.createElement('div');
    div.className = 'song-item';
    div.innerHTML = `
      <h3>${escapeHtml(song.name)} — ${escapeHtml(song.singer)}</h3>
      <p><a href="${escapeHtml(song.youtube)}" target="_blank" rel="noopener">YouTube 連結</a></p>
      ${song.description ? `<p><strong style="color:#c4b5fd;">描述：</strong>${escapeHtml(song.description)}</p>` : ''}
      ${song.paraphrase ? `<p><strong style="color:#f9a8d4;">同義改寫：</strong></p><pre>${escapeHtml(song.paraphrase)}</pre>` : ''}
      <pre>${escapeHtml(song.lyrics)}</pre>
      <button class="btn-warning" onclick="deleteSong(${index})" style="margin-top:12px;">刪除此歌曲</button>
    `;
    list.appendChild(div);
  });
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text || '';
  return div.innerHTML;
}

function deleteSong(index) {
  if (!confirm('確定刪除這首歌？')) return;
  const songs = loadSongs();
  songs.splice(index, 1);
  saveSongs(songs);
}

function exportJSON() {
  const songs = loadSongs();
  if (songs.length === 0) {
    alert('目前沒有歌曲可以匯出');
    return;
  }
  const blob = new Blob([JSON.stringify(songs, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'songs.json';
  a.click();
  URL.revokeObjectURL(url);
  alert('已下載 songs.json！');
}

function importJSON(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error('格式不正確');
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      renderList();
      alert(`成功匯入 ${data.length} 首歌曲！`);
    } catch (err) {
      alert('匯入失敗：JSON 格式錯誤');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function clearAll() {
  if (!confirm('確定要清空所有歌曲嗎？此操作無法復原。')) return;
  localStorage.removeItem(STORAGE_KEY);
  renderList();
}

document.getElementById('songForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const song = {
    youtube: document.getElementById('youtube').value.trim(),
    name: document.getElementById('name').value.trim(),
    singer: document.getElementById('singer').value.trim(),
    lyrics: document.getElementById('lyrics').value.trim(),
    description: document.getElementById('description').value.trim(),
    paraphrase: document.getElementById('paraphrase').value.trim()
  };

  if (!song.youtube || !song.name || !song.singer || !song.lyrics) {
    alert('請填寫必要欄位');
    return;
  }

  const songs = loadSongs();
  songs.push(song);
  saveSongs(songs);
  this.reset();
  alert('歌曲已儲存！');
});

renderList();
</script>
</body>
</html>
